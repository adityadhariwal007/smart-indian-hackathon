<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="hf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="128" fill="url(#hf-grad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" />
  
  <!-- Medical Heart Pulse Line -->
  <g filter="url(#hf-glow)">
    <path 
      d="M80 264 L180 264 L216 160 L272 368 L324 232 L356 264 L432 264" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
  
  <!-- Top Center Medical Cross Accent -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="240" y="80" width="32" height="64" rx="8" />
    <rect x="224" y="96" width="64" height="32" rx="8" />
  </g>
</svg>