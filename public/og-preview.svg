<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061e19" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="280" fill="#059669" opacity="0.12" />
  <circle cx="1050" cy="450" r="320" fill="#0284C7" opacity="0.15" />

  <!-- Grid overlay -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(100, 90)">
    <rect width="360" height="42" rx="21" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#34D399" />
    <text x="40" y="26" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
      SMART PATIALA HEALTHCARE NETWORK
    </text>
  </g>

  <!-- Brand Logo & Name -->
  <g transform="translate(100, 160)">
    <!-- Emblem Box -->
    <rect width="64" height="64" rx="16" fill="#059669" />
    <path d="M12 32 L24 32 L28 20 L36 44 L44 28 L48 32 L56 32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      HealthFlow
    </text>
  </g>

  <!-- Headline -->
  <text x="100" y="295" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Better healthcare. Less waiting.
  </text>
  <text x="100" y="360" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Less hassle.
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.2">
    Zero-wait outpatient triage, live hospital bed occupancy, and 108/112 emergency routing.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">
      ⚡ Live Queue Tokens
    </text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="255" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">
      🏥 20 Patiala Centers
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="500" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">
      🚑 Rapid SOS Dispatch
    </text>

    <!-- Pill 4 -->
    <rect x="725" y="0" width="240" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="745" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">
      ABDM &amp; ABHA Verified
    </text>
  </g>

  <!-- Bottom Right Domain Watermark -->
  <text x="1080" y="580" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">
    smart-indian-hackathon.vercel.app
  </text>
</svg>
